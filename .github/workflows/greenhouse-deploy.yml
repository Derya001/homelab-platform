name: Greenhouse GitOps Deploy

on:
  push:
    paths:
      - 'greenhouse/**'

jobs:
  trigger-awx:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AWX Workflow
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '${{ github.event.after }}' | openssl dgst -sha256 -hmac '${{ secrets.AWX_WEBHOOK_KEY }}' | cut -d' ' -f2)" \
            -d '{"ref": "${{ github.ref }}"}' \
            https://awx-server.taileaaeb7.ts.net/api/v2/workflow_job_templates/16/github/
