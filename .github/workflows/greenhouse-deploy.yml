name: Greenhouse GitOps Deploy

on:
  push:
    paths:
      - 'greenhouse/**'

jobs:
  trigger-awx:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AWX Workflow
        env:
          AWX_WEBHOOK_KEY: ${{ secrets.AWX_WEBHOOK_KEY }}
        run: |
          PAYLOAD='{"ref":"${{ github.ref }}","after":"${{ github.sha }}"}'
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$AWX_WEBHOOK_KEY" | awk '{print $2}')
          curl -v -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD" \
            https://awx-server.taileaaeb7.ts.net/api/v2/workflow_job_templates/16/github/
