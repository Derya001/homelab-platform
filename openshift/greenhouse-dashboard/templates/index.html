<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenhouse Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00d4aa;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 40px auto;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            border: 1px solid #0f3460;
        }
        .card h2 {
            color: #00d4aa;
            margin-bottom: 10px;
        }
        .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #e94560;
        }
        .unit {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 5px;
        }
        .status {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <h1>🌿 Greenhouse Dashboard</h1>
    <div class="grid">
        <div class="card">
            <h2>🌡️ Temperature</h2>
            <div class="value" id="temp">--</div>
            <div class="unit">°C</div>
        </div>
        <div class="card">
            <h2>💧 Humidity</h2>
            <div class="value" id="hum">--</div>
            <div class="unit">%</div>
        </div>
        <div class="card">
            <h2>🌱 Soil Moisture</h2>
            <div class="value" id="soil">--</div>
            <div class="unit">raw ADC</div>
        </div>
        <div class="card">
            <h2>☀️ Light</h2>
            <div class="value" id="light">--</div>
            <div class="unit">lux</div>
        </div>
    </div>
    <div class="status" id="status">Loading...</div>

    <script>
        function fetchData() {
            fetch('/api/sensors')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('temp').textContent = data.temperature ?? '--';
                    document.getElementById('hum').textContent = data.humidity ?? '--';
                    document.getElementById('soil').textContent = data.soil ?? '--';
                    document.getElementById('light').textContent = data.light ?? '--';
                    document.getElementById('status').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
                })
                .catch(() => {
                    document.getElementById('status').textContent = 'Error fetching data';
                });
        }
        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
